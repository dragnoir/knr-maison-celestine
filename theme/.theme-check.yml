# Horizon 4.3.0 repeats static block IDs intentionally across alternate render paths.
UniqueStaticBlockId:
  ignore:
    - sections/product-list.liquid
    - sections/main-cart.liquid
    - sections/collection-links.liquid
    - sections/header.liquid
# Installed Horizon uses a platform filter not yet present in the CLI documentation bundle.
UnknownFilter:
  ignore:
    - blocks/disclosures.liquid
    - snippets/cart-disclosure-tooltip.liquid
